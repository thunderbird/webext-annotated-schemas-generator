name: Sub-Workflow to update a single schema version

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
        default: esr
      manifestVersion:
        required: true
        type: string
        default: 3
      compatData:
        required: false
        type: boolean
        default: true
    secrets:
      SCHEMA_REPO_DEPLOY_KEY:
        required: true

jobs:
  update-schema:
    runs-on: ubuntu-latest
    # All workflows share the schema-cache, run them one after another.
    concurrency:
      group: schema-cache
      cancel-in-progress: false
    env:
      BRANCH: ${{ inputs.release }}-mv${{ inputs.manifestVersion }}

    steps:
      - name: Check repository
        if: github.repository != 'thunderbird/webext-annotated-schemas-generator'
        run: |
          echo "::error::This workflow is designed to run only in thunderbird/webext-annotated-schemas-generator"
          echo "::error::Current repository: ${{ github.repository }}"
          echo "::error::This is likely a fork. Please disable GitHub Actions in your fork settings:"
          echo "::error::Go to Settings → Actions → General → Actions permissions → Disable actions"
          exit 1

      - name: Checkout generator default branch
        uses: actions/checkout@v6

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SCHEMA_REPO_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Diagnose SSH key format
        run: |
          echo "=== SSH/OpenSSL versions on runner ==="
          ssh -V 2>&1
          openssl version
          echo ""
          echo "=== Key format detection ==="
          if head -n 1 ~/.ssh/id_rsa | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "Key format: OpenSSH"
          elif head -n 1 ~/.ssh/id_rsa | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "Key format: PEM/RSA"
          elif head -n 1 ~/.ssh/id_rsa | grep -q "BEGIN EC PRIVATE KEY"; then
            echo "Key format: PEM/EC"
          elif head -n 1 ~/.ssh/id_rsa | grep -q "BEGIN PRIVATE KEY"; then
            echo "Key format: PKCS#8 PEM"
          else
            echo "Key format: Unknown or unrecognized"
          fi

      - name: Clone webext-annotated-schemas repo
        run: |
          # Remove existing docs folder if it exists
          rm -rf output

          # Clone the desired branch into output/
          git clone --branch ${{ env.BRANCH }} git@github.com:thunderbird/webext-annotated-schemas.git output

      # The git cache (a clone of the Thunderbird repository) of the last run.
      # The generator updates it, or clones it again if it is missing or
      # invalid.
      - name: Restore the git cache (if available)
        uses: actions/cache/restore@v5
        with:
          path: git-cache
          key: schema-cache

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install

      - name: Run generator script for --release=${{ inputs.release }} --manifest_version=${{ inputs.manifestVersion }}
        id: generate
        env:
          # Raises the limit of the GitHub API, see modules/sources.mjs.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node get_thunderbird_schema_files.js --release=${{ inputs.release }} --manifest_version=${{ inputs.manifestVersion }} --output=./output/schema-files/ --no-link-check ${{ inputs.compatData == false && '--no-compat-data' || '' }}

      # A cache entry can not be overwritten. Always delete it, which also
      # removes an entry of a different path (e.g. the former
      # persistent_schema_cache.json) stored under the same key.
      - name: Delete Previous Cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache delete schema-cache || echo "No cache to delete."

      - name: Save the git cache
        uses: actions/cache/save@v5
        with:
          path: git-cache
          key: schema-cache

      - name: Commit and push changes
        working-directory: output
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schema-files
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update schema files (${{ env.BRANCH }}, ${{ steps.generate.outputs.tag_name }})"
            git push origin HEAD:${{ env.BRANCH }}
            git tag -f ${{ steps.generate.outputs.tag_name }}-mv${{ inputs.manifestVersion }}
            git push origin -f ${{ steps.generate.outputs.tag_name }}-mv${{ inputs.manifestVersion }}
          fi
